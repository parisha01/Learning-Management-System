  <rect x="660" y="342" width="90" height="36" rx="8" fill="#16233F"/>
  <text x="705" y="365" text-anchor="middle" font-family="Arial" font-size="12" fill="#F3F1EA">Post</text>

  <text x="30" y="430" font-family="Arial" font-size="12" fill="#3C4859" font-weight="bold">12 replies · updated 2 hours ago</text>
