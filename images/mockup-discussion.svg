<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="discussTitle">
  <title id="discussTitle">Discussion board screen showing a threaded conversation between learners and an instructor</title>
  <rect width="800" height="560" rx="18" fill="#FFFFFF"/>
  <rect width="800" height="56" rx="18" fill="#16233F"/>
  <rect y="38" width="800" height="18" fill="#16233F"/>
  <text x="30" y="34" font-family="Arial" font-size="16" fill="#F3F1EA">Discussion — Module 4 case study</text>

  <g font-family="Arial" font-size="13">
    <circle cx="60" cy="110" r="18" fill="#5C8374"/>
    <text x="60" y="115" text-anchor="middle" fill="#fff">JR</text>
    <rect x="90" y="88" width="420" height="56" rx="12" fill="#F1F3EF"/>
    <text x="106" y="108" fill="#16233F" font-weight="bold">Jordan R.</text>
    <text x="106" y="128" fill="#3C4859">How did everyone handle the budget variance in part 2?</text>

    <circle cx="60" cy="184" r="18" fill="#E3A23C"/>
