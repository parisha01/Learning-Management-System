    <text x="106" y="202" fill="#3C4859">Good question — check the formula sheet on page 3.</text>

    <circle cx="60" cy="258" r="18" fill="#C4573A"/>
    <text x="60" y="263" text-anchor="middle" fill="#fff">SK</text>
    <rect x="90" y="236" width="380" height="56" rx="12" fill="#F1F3EF"/>
    <text x="106" y="256" fill="#16233F" font-weight="bold">Sam K.</text>
    <text x="106" y="276" fill="#3C4859">That worked, thank you both!</text>
  </g>

  <rect x="30" y="330" width="740" height="60" rx="12" fill="#F1F3EF" stroke="#D9DED6"/>
